apiVersion: v1
kind: Secret
metadata:
  name: phc-secrets
data:
  AES_KEY: {{ .Values.global.secrets.aes | default (randAlphaNum 16 | sha256sum | trunc 64) | b64enc | quote }}
  HMAC_KEY: {{ .Values.global.secrets.altcha.hmacKey | default (randAlphaNum 16 | sha256sum | trunc 64) | b64enc | quote }}
  {{- /* No random default: rotating it resets Shahkar's cache, rate limits and stored lookup hashes. */}}
  {{- with (.Values.global.secrets.shahkar).hashKey }}
  SHAHKAR_HASH_KEY: {{ . | b64enc | quote }}
  {{- end }}
type: Opaque

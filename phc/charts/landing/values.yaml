enabled: false

replicaCount: 3

image:
  repository: registry.wenex.org/w3x/phc-landing
  pullPolicy: IfNotPresent
  tag: "1.0.0"

fullnameOverride: "phc-landing"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

autoscaling:
  enabled: false

environments:
  nuxt:
    # *****************************
    # Public Information
    # *****************************
    public:
      apiBaseUrl: "https://api.phc.w3x.app/-"
      # Empty follows apiBaseUrl, the app's own fallback.
      platformApiBaseUrl: ""
      # MQTT Over WebSocket (the app has no default of its own)
      mqttWsUrl: "wss://emqx.wenex.org/mqtt"
      # *****************************
      # Site Information
      # *****************************
      panelUrl: "https://panel.phc.w3x.app"
      # *****************************
      # Security Services
      # *****************************
      altcha:
        challengeUrl: "https://api.phc.w3x.app/challenge"
      # *****************************
      # Client Information
      # *****************************
      appId: ""
      clientId: ""
      # *****************************
      # Logging Services
      # *****************************
      sentry:
        dsn: ""
        tracesSampleRate: "0.8"

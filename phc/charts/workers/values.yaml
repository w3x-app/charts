enabled: false

replicaCount: 3

fullnameOverride: "phc-workers"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

autoscaling:
  enabled: false
